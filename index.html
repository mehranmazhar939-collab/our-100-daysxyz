<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy 100 Days, My Love</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff0ee;--bg2:#ffd9e2;--ink:#3b1230;--soft:#7a4a68;--card:#ffffffb8;--rose:#d6336c;--gold:#c98a12;--line:#3b123022;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c0a1a;--bg2:#3a1331;--ink:#ffe9ee;--soft:#d7a9c0;--card:#ffffff12;--rose:#ff7aa3;--gold:#ffcf6b;--line:#ffffff22}}
:root[data-theme="dark"]{--bg:#1c0a1a;--bg2:#3a1331;--ink:#ffe9ee;--soft:#d7a9c0;--card:#ffffff12;--rose:#ff7aa3;--gold:#ffcf6b;--line:#ffffff22}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);background:linear-gradient(var(--bg),var(--bg2)) fixed;color:var(--ink);font:400 1.05rem/1.7 Fraunces,Georgia,serif;text-align:center;overflow-x:hidden}
[hidden]{display:none!important}
h1,h2,.script{font-family:"Pinyon Script","Snell Roundhand",cursive;font-weight:400;margin:0;line-height:1.1}
h2{font-size:2.4rem;color:var(--rose);margin-bottom:.8rem}
main{position:relative;z-index:1}
.sec{max-width:34rem;margin:0 auto;padding:4.5rem 1.4rem}
.hero{min-height:92vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:2rem 1.4rem}
.hero .script{font-size:clamp(2.6rem,13vw,5rem);color:var(--rose)}
.hero h1{font-size:clamp(2.2rem,10vw,3.6rem);color:var(--gold);margin:.3rem 0 1.4rem}
.typed{min-height:3.6em;max-width:26rem;color:var(--soft);font-style:italic;margin:0}
.hint{margin-top:2rem;color:var(--soft);font-size:.9rem}
.btn{font:600 1rem Fraunces,Georgia,serif;color:#fff;background:var(--rose);border:0;border-radius:99px;padding:.85rem 1.7rem;cursor:pointer;margin-top:1rem}
.btn:hover{filter:brightness(1.08)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#gate{position:fixed;inset:0;z-index:20;background:var(--bg);background:linear-gradient(var(--bg),var(--bg2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;transition:opacity .8s,transform .8s}
#gate.go{opacity:0;transform:scale(1.15);pointer-events:none}
#open{font-size:5.5rem;background:none;border:0;cursor:pointer;animation:beat 1.4s infinite}
@keyframes beat{50%{transform:scale(1.12)}}
#gate p{color:var(--soft);margin:0;font-style:italic}
#mus{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:30;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:1.2rem;cursor:pointer;backdrop-filter:blur(6px)}
#mus.on{background:var(--rose)}
.sp{position:fixed;left:50%;transform:translateX(-50%);width:min(92vw,420px);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:25;opacity:0;pointer-events:none;transition:opacity .8s}
.sp.on{opacity:1;pointer-events:auto}
.sp iframe{display:block;border-radius:12px}
.has-sp main{padding-bottom:6rem}
.h{position:fixed;bottom:-40px;z-index:0;pointer-events:none;opacity:.75;animation:up linear forwards}
@keyframes up{to{transform:translateY(-115vh) rotate(40deg);opacity:0}}
#fx{position:fixed;inset:0;z-index:40;pointer-events:none}
.cake{position:relative;width:200px;height:170px;margin:80px auto 28px}
.cake>*{position:absolute;left:50%;transform:translateX(-50%)}
.t1{bottom:0;width:200px;height:70px;border-radius:16px;background:linear-gradient(#ff9fb7,#ff6f98)}
.t2{bottom:70px;width:140px;height:55px;border-radius:14px;background:linear-gradient(#ffd1dc,#ffaec4)}
.ic{bottom:113px;width:140px;height:14px;border-radius:8px;background:#fff}
.can{bottom:122px;width:46px;height:56px;font:800 4rem/56px Fraunces,Georgia,serif;background:repeating-linear-gradient(45deg,#fff 0 7px,#e11d5a 7px 14px);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #e11d5a;user-select:none}
.can .fl{top:-12px;left:50%;margin-left:-5px}
.fl{position:absolute;top:-20px;left:-1px;width:10px;height:17px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(#fff6b0,#ffb020 60%,transparent 72%);box-shadow:0 0 16px 6px #ffb02066;animation:fl .35s infinite alternate;transform-origin:50% 100%}
@keyframes fl{to{transform:scale(1.15,.9) rotate(4deg)}}
.out .fl{display:none}
.wish{min-height:2em;color:var(--soft);font-style:italic}
.letter{background:var(--card);border:1px solid var(--line);border-radius:6px 22px 6px 22px;padding:2rem 1.6rem;text-align:left;backdrop-filter:blur(6px)}
.letter h3{font:400 1.9rem "Pinyon Script",cursive;color:var(--rose);margin:0 0 .6rem}
.letter p{margin:.7rem 0}
.mem{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}
.m{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.7rem;cursor:pointer;color:inherit;font:inherit;text-align:center}
.m:nth-child(odd){transform:rotate(-1.5deg)}.m:nth-child(even){transform:rotate(1.5deg)}
.ph{height:110px;border-radius:8px;background:var(--bg2) center top/cover;display:grid;place-items:center;font-size:2.4rem;margin-bottom:.5rem}
.m b{display:block;font-size:.95rem}.m small{color:var(--soft);font-size:.82rem;line-height:1.3;display:block}
.note{color:var(--soft);font-size:.85rem;margin-top:1rem}
.lb{position:fixed;inset:0;z-index:50;background:#000000e6;display:grid;place-items:center;padding:1rem;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:10px}
.gifts{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}
.gift{width:8.4rem;min-height:8.4rem;padding:.6rem;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer;font-size:3rem;transition:transform .3s}
.gift:hover{transform:translateY(-4px)}
.gift small{display:block;font-size:.88rem;line-height:1.35;font-style:italic}
.gift.open{font-size:1rem;cursor:default;transform:none;border-color:var(--gold)}
.end .script{font-size:clamp(2.4rem,11vw,3.6rem);color:var(--rose)}
.end p{color:var(--soft)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<button id="mus" aria-label="Play birthday tune">🎵</button>
<div class="sp" id="spw"><div id="sp"></div></div>

<section id="gate"><button id="open" aria-label="Open your surprise">💌</button><p>Tap to open your surprise</p></section>

<main id="main" hidden>
  <section class="hero">
    <p class="script">Happy 100 days,</p>
    <h1 id="nm"></h1>
    <p class="typed" id="typed"></p>
    <span class="hint">Scroll down, there's more ↓</span>
  </section>

  <section class="sec">
    <h2>Make a wish</h2>
    <div class="cake" id="cake">
      <div class="t1"></div><div class="t2"></div><div class="ic"></div>
      <div class="can" style="margin-left:-46px">1<i class="fl"></i></div>
      <div class="can">0<i class="fl"></i></div>
      <div class="can" style="margin-left:46px">0<i class="fl"></i></div>
    </div>
    <button class="btn" id="blow">Blow out the candles</button>
    <p class="wish" id="wish"></p>
  </section>

  <section class="sec">
    <h2>A letter for you</h2>
    <article class="letter"><h3 id="dear"></h3><div id="letter"></div><p class="script" style="font-size:1.8rem;color:var(--rose)" id="sign"></p></article>
  </section>

  <section class="sec">
    <h2>Our memories</h2>
    <div class="mem" id="mem"></div>
  </section>

  <section class="sec">
    <h2>Little surprises</h2>
    <div class="gifts" id="gifts"></div>
  </section>

  <section class="sec end">
    <p class="script">I love you my Zann</p>
    <p>Today, tomorrow, and every birthday after.</p>
    <button class="btn" id="again">Celebrate again 🎉</button>
  </section>
</main>

<script>
// ✏️ Edit this block to personalise. You can also use ?name=Sara&from=Ali in the page link.
const q=new URLSearchParams(location.search);
const C={
  name:q.get('name')||'My Love',
  from:q.get('from')||'Yours, always',
  typed:"I'm the lucky one who gets to love you.",
  wish:"May every wish you just made come true. 💫",
  letter:[
    "Every day with you feels like a small celebration, but today I get to say it out loud: I'm so grateful I found you.",
    "You make ordinary moments feel special. Your laugh, your kindness and the way you care about everyone around you have changed my life.",
    "Thank you for being my safe place. I wish the best for you and I pray we stay together forever."
  ],
  memories:[
    // img: file name of a photo in the same folder, e.g. img:"photo1.jpg". Leave "" to show the emoji.
    {e:"☕",t:"The day we met",d:"I knew right away.",img:PHOTOS.meet},
    {e:"🌅",t:"Confession",d:"Best day ever.",img:PHOTOS.confession},
    {e:"🌙",t:"My most fav view",d:"I love you so much",img:PHOTOS.view,pos:"50% 45%"},
    {e:"🎶",t:"Our song",d:"Always reminds me of you",img:PHOTOS.song,pos:"50% 40%"}
  ],
  gifts:["A lifetime of hugs","One dinner, your favourite place","Breakfast in bed, no excuses","A promise: I'll always choose you"]
};
const $=id=>document.getElementById(id), RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
$('nm').textContent=C.name;
$('dear').textContent='Dear '+C.name+',';
$('sign').textContent=C.from;
C.letter.forEach(t=>{const p=document.createElement('p');p.textContent=t;$('letter').append(p)});

// memories (tap to add a photo)
const fi=document.createElement('input');fi.type='file';fi.accept='image/*';let tgt=null;
fi.onchange=()=>{const f=fi.files[0];if(!f||!tgt)return;const r=new FileReader();r.onload=()=>{const ph=tgt.querySelector('.ph');ph.style.backgroundImage='url('+r.result+')';ph.textContent=''};r.readAsDataURL(f)};
C.memories.forEach(m=>{const b=document.createElement('button');b.className='m';
  b.innerHTML='<div class="ph"></div><b></b><small></small>';
  b.querySelector('.ph').textContent=m.e;b.querySelector('b').textContent=m.t;b.querySelector('small').textContent=m.d;
  if(m.img){const ph=b.querySelector('.ph');ph.style.backgroundImage='url("'+m.img+'")';ph.textContent='';if(m.pos)ph.style.backgroundPosition=m.pos}
  b.onclick=()=>{if(m.img)return zoom(m.img);tgt=b;fi.click()};$('mem').append(b)});
function zoom(src){const d=document.createElement('div');d.className='lb';const i=document.createElement('img');i.src=src;i.alt='';d.append(i);d.onclick=()=>d.remove();document.body.append(d)}

// gifts
C.gifts.forEach(g=>{const b=document.createElement('button');b.className='gift';b.textContent='🎁';b.setAttribute('aria-label','Open gift');
  b.onclick=()=>{if(b.classList.contains('open'))return;b.classList.add('open');const s=document.createElement('small');s.textContent=g;b.textContent='';b.append(s);burst(50)};$('gifts').append(b)});

// confetti
const cv=$('fx'),cx=cv.getContext('2d');let P=[],run=false;
function fit(){cv.width=innerWidth;cv.height=innerHeight}fit();addEventListener('resize',fit);
function burst(n){if(RM)return;for(let i=0;i<n;i++)P.push({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:5+Math.random()*5,c:'hsl('+(Math.random()*360)+' 90% 65%)',a:1});if(!run){run=true;loop()}}
function loop(){cx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.vx*=.99;p.a-=.008;cx.globalAlpha=Math.max(p.a,0);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.r,p.r*.6)});P=P.filter(p=>p.a>0&&p.y<cv.height+20);if(P.length)requestAnimationFrame(loop);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}}

// floating hearts (only during the opening moment)
function heart(){const h=document.createElement('span');h.className='h';h.textContent=['❤','💗','💖','🌸'][Math.random()*4|0];
  h.style.cssText='left:'+Math.random()*100+'%;font-size:'+(14+Math.random()*22)+'px;animation-duration:'+(6+Math.random()*5)+'s';
  document.body.append(h);h.onanimationend=()=>h.remove()}
function type(el,t,i=0){el.textContent=t.slice(0,i);if(i<t.length)setTimeout(()=>type(el,t,i+1),RM?0:38)}

// 🎵 SPOTIFY: paste your song link between the quotes (Spotify > song > Share > Copy Song Link). Leave '' to skip.
const SPOTIFY='https://open.spotify.com/track/4uQY80TKE1u4ZQZQKHzVEi';
const SP=SPOTIFY.match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?(track|album|playlist)\/([A-Za-z0-9]+)/);
let sp=null,spWant=false;
if(SP){
  document.body.classList.add('has-sp');$('mus').hidden=true;
  window.onSpotifyIframeApiReady=A=>A.createController($('sp'),{uri:'spotify:'+SP[1]+':'+SP[2],width:'100%',height:80},c=>{sp=c;if(spWant)c.play()});
  const s=document.createElement('script');s.src='https://open.spotify.com/embed/iframe-api/v1';s.async=true;document.head.append(s);
}

$('open').onclick=()=>{
  $('gate').classList.add('go');$('main').hidden=false;scrollTo(0,0);
  setTimeout(()=>{$('gate').hidden=true},900);
  setTimeout(()=>type($('typed'),C.typed),500);
  burst(120);
  if(SP){spWant=true;$('spw').classList.add('on');if(sp)sp.play()}
  if(!RM){let n=0;const iv=setInterval(()=>{heart();if(++n>28)clearInterval(iv)},280)}
};
$('blow').onclick=()=>{$('cake').classList.add('out');$('wish').textContent=C.wish;burst(140);$('blow').hidden=true};
$('again').onclick=()=>{scrollTo({top:0});burst(160);const iv=setInterval(heart,200);setTimeout(()=>clearInterval(iv),5000)};

// birthday tune (WebAudio, no files needed)
const M=[[392,.75],[392,.25],[440,1],[392,1],[523,1],[494,2],[392,.75],[392,.25],[440,1],[392,1],[587,1],[523,2],[392,.75],[392,.25],[784,1],[659,1],[523,1],[494,1],[440,2],[698,.75],[698,.25],[659,1],[523,1],[587,1],[523,2]];
let ac=null;
$('mus').onclick=()=>{
  if(ac){ac.close();ac=null;$('mus').classList.remove('on');return}
  const a=ac=new(window.AudioContext||window.webkitAudioContext)(),b=.42;let t=a.currentTime+.05;
  M.forEach(([f,d])=>{const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+d*b);
    o.connect(g).connect(a.destination);o.start(t);o.stop(t+d*b);t+=d*b});
  $('mus').classList.add('on');
  setTimeout(()=>{if(ac===a){a.close();ac=null;$('mus').classList.remove('on')}},(t-a.currentTime)*1000+300);
};
</script>
